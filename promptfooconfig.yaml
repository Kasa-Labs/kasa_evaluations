  #   config:
  #     projectId: "{{ env.GOOGLE_CLOUD_PROJECT }}"
  #     region: us-central1
  #     temperature: 0.2
  #     maxOutputTokens: 4000

  # Note: Gemini 3 requires region: global
  - id: vertex:gemini-3-pro-preview
    label: Gemini 3 Pro Preview
    config:
      projectId: "{{ env.GOOGLE_CLOUD_PROJECT }}"
      region: global
      temperature: 0.2
      maxOutputTokens: 4000

  # --- Google Vertex AI: Claude (Model Garden) ---
  # Note: Claude on Vertex requires us-east5 region
