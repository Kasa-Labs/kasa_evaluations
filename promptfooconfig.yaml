  #   config:
  #     projectId: "{{ env.GOOGLE_CLOUD_PROJECT }}"
  #     region: us-central1
  #     temperature: 0.2
  #     maxOutputTokens: 4000

  # - id: vertex:llama-4-maverick-17b-128e-instruct-maas
  #   label: Llama 4 Maverick 17B
  #   config:
  #     projectId: "{{ env.GOOGLE_CLOUD_PROJECT }}"
  #     region: us-central1
  #     temperature: 0.2
