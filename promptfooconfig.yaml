description: "Kasa Medical Note Generation Eval"

prompts:
  - file://prompts/v1-original.txt
  - file://prompts/v2-concise.txt

providers:
  # --- OpenAI ---
  # - id: openai:chat:gpt-4o
  #   label: GPT-4o
  #   config:
  #     temperature: 0.2
  #     max_tokens: 2000

  # - id: openai:chat:gpt-4o-mini
  #   label: GPT-4o Mini
  #   config:
  #     temperature: 0.2
  #     max_tokens: 2000

  # --- Google Vertex AI: Gemini ---
  # - id: vertex:gemini-2.5-flash
