  #   config:
  #     projectId: "{{ env.GOOGLE_CLOUD_PROJECT }}"
  #     region: us-east5
  #     temperature: 0.2
  #     max_tokens: 2000

  # --- Google Vertex AI: Open Source ---
  # Uncomment to include in eval runs

  # - id: vertex:llama-3.3-70b-instruct-maas
