  # - id: vertex:mistral-large-3
  #   label: Mistral Large 3
  #   config:
  #     projectId: "{{ env.GOOGLE_CLOUD_PROJECT }}"
  #     region: us-central1
  #     temperature: 0.2
  #     maxOutputTokens: 4000

  # --- Local (Ollama) ---
  # Requires: brew services start ollama
  - id: ollama:chat:gemma3n
    label: Gemma 3n (local)
    config:
      temperature: 0.2
      num_predict: 4000

  - id: ollama:chat:phi3:mini
    label: Phi-3 Mini (local)
    config:
      temperature: 0.2
      num_predict: 4000

  - id: ollama:chat:llama3.2
    label: Llama 3.2 (local)
    config:
      temperature: 0.2
      num_predict: 4000

  - id: ollama:chat:gemma2:2b
    label: Gemma 2B (local)
    config:
      temperature: 0.2
      num_predict: 4000

  - id: ollama:chat:qwen2
    label: Qwen 2 (local)
    config:
      temperature: 0.2
      num_predict: 4000

  - id: ollama:chat:alibayram/medgemma:4b
    label: MedGemma 4B (local)
    config:
      temperature: 0.2
      num_predict: 4000

# Use Gemini 3 Pro Preview as the judge model for LLM-as-judge assertions
defaultTest:
  options:
    provider:
      id: vertex:gemini-3-pro-preview
      config:
        projectId: "{{ env.GOOGLE_CLOUD_PROJECT }}"
        region: global
        temperature: 0.0

# Test cases are generated by: npx tsx scripts/build-promptfoo-tests.ts
tests: file://tests.yaml
